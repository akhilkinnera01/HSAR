name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Go: lint, vet, build ───
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make gen-proto

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: go build
        run: go build ./cmd/proxy/

  # ─── Python: lint ───
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          pip install -r signal-engine/requirements.txt

      - name: Generate protobuf (Python)
        run: |
          pip install grpcio-tools
          make gen-proto-python

      - name: ruff check
        run: ruff check signal-engine/

  # ─── Docker: build verification ───
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build proxy image
        run: docker build -f deploy/Dockerfile.proxy -t hsar-proxy .

      - name: Build signal-engine image
        run: docker build -f deploy/Dockerfile.signal -t hsar-signal .

  # ─── Proto: diff check ───
  proto:
    name: Proto consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc + Go plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Regenerate and diff
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make gen-proto
          if ! git diff --quiet gen/; then
            echo "::error::Generated proto files are out of date. Run 'make gen-proto' and commit."
            git diff --stat gen/
            exit 1
          fi
