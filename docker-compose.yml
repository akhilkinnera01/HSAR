version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    ports:
      - "8080:8080"
    environment:
      - SIGNAL_ENGINE_TARGET=signal-engine:50051
      - UPSTREAM_BASE_URL=http://backend:8081
      - TENANT_API_KEYS=dev-key-1:default-tenant
      - TENANT_RATE_RPS=100
      - TENANT_RATE_BURST=100
      - MODE=shadow
      - PORT=8080
    depends_on:
      - signal-engine
      - backend
    networks:
      - hsar-net

  signal-engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile.signal
    expose:
      - "50051"
    networks:
      - hsar-net

  backend:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python3", "deploy/echo_backend.py"]
    expose:
      - "8081"
    networks:
      - hsar-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - hsar-net
    profiles:
      - ollama

networks:
  hsar-net:
    driver: bridge

volumes:
  ollama-data: